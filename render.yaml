services:
  - type: web
    name: erp-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:backend
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://erp-web.onrender.com

  - type: web
    name: erp-web
    runtime: static
    buildCommand: |
      export API_BASE_URL="${API_BASE_URL:-https://erp-api.onrender.com}"
      export EXPO_PUBLIC_API_URL="${API_BASE_URL}/api"
      npm ci
      npm exec --workspace frontend expo export -- --platform web
    staticPublishPath: frontend/dist
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: erp-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
